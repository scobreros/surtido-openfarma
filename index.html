<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surtido Eficiente · OpenFarma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --ink:#1D231F;
    --muted:#6E7568;
    --muted-2:#9A9D91;
    --primary:#1F4D46;
    --primary-ink:#0F2C27;
    --primary-light:#DEEBE6;
    --accent:#E1613F;
    --accent-light:#FBE4DA;
    --border:#E7E2D6;
    --radius:14px;
    --shadow: 0 1px 2px rgba(20,30,25,.06), 0 6px 20px rgba(20,30,25,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
    text-transform:uppercase;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:var(--primary);
    color:#fff;
    padding:22px 20px 26px;
    overflow:hidden;
    isolation:isolate;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.16) 0 2px,
        transparent 2px 5px,
        rgba(255,255,255,.10) 5px 6px,
        transparent 6px 11px,
        rgba(255,255,255,.16) 11px 14px,
        transparent 14px 22px,
        rgba(255,255,255,.09) 22px 24px,
        transparent 24px 30px
      );
    opacity:.55;
    z-index:0;
    mask-image:linear-gradient(to bottom, black, transparent 92%);
  }
  .hero-inner{position:relative; z-index:1;}
  .hero-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.72);
    margin:0 0 6px;
  }
  .hero h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:26px;
    line-height:1.1;
    margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .hero p.sub{
    margin:0;
    font-size:13.5px;
    color:rgba(255,255,255,.78);
  }
  .updated-pill{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:14px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);
    padding:5px 10px 5px 8px;
    border-radius:999px;
    font-size:11.5px;
    color:rgba(255,255,255,.92);
  }
  .updated-pill .dot{width:6px;height:6px;border-radius:50%;background:#7FE0B8;}

  /* ---------- CONTROLS ---------- */
  .controls{
    padding:16px 16px 4px;
    max-width:720px;
    margin:0 auto;
  }
  .field-label{
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    margin:0 2px 6px;
  }
  .select-wrap{
    position:relative;
    margin-bottom:14px;
  }
  .select-wrap.big select{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--primary-ink);
    background:var(--surface);
    border:1.5px solid var(--border);
    box-shadow:var(--shadow);
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:12px 38px 12px 14px;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  select:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .select-wrap::after{
    content:"";
    position:absolute; right:14px; top:50%;
    width:9px; height:9px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .pill-row{
    display:flex; gap:8px;
    overflow-x:auto;
    padding:2px 2px 12px;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    font-size:13.5px;
    font-weight:600;
    color:var(--primary-ink);
    background:var(--surface);
    border:1.5px solid var(--border);
    padding:8px 14px;
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  .pill.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  .search-wrap{position:relative; margin-bottom:6px;}
  .search-wrap input{
    width:100%;
    padding:12px 46px 12px 38px;
    border-radius:var(--radius);
    border:1.5px solid var(--border);
    background:var(--surface);
    font-size:14.5px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .search-wrap input:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--muted-2);
  }
  .scan-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:34px; height:34px;
    border-radius:9px;
    border:none;
    background:var(--primary-light);
    color:var(--primary);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .scan-btn:active{background:var(--primary); color:#fff;}

  .scan-modal{
    display:none;
    position:fixed; inset:0;
    background:rgba(15,20,17,.92);
    z-index:50;
    flex-direction:column;
  }
  .scan-modal.open{display:flex;}
  .scan-modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 10px;
    color:#fff;
  }
  .scan-modal-head h2{
    font-family:'Manrope',sans-serif;
    font-size:15px; font-weight:700; margin:0;
  }
  .scan-close{
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.14);
    border:none; color:#fff; font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  #qr-reader{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 10px;
  }
  #qr-reader video, #qr-reader canvas{
    border-radius:14px;
  }
  .scan-hint{
    text-align:center;
    color:rgba(255,255,255,.72);
    font-size:12.5px;
    padding:10px 24px 26px;
  }
  .scan-error{
    color:#FBC7B8;
    text-align:center;
    font-size:13px;
    padding:0 24px 20px;
  }

  /* ---------- SUMMARY ---------- */
  .summary{
    max-width:720px;
    margin:6px auto 0;
    padding:0 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .summary .count{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--primary-ink);
  }
  .summary .count span{color:var(--accent);}
  .summary .branch-tag{
    font-size:12px;
    color:var(--muted);
    text-align:right;
  }

  /* ---------- LIST ---------- */
  .list{
    max-width:720px;
    margin:12px auto 0;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .fab-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .fab-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    cursor:pointer;
  }
  .fab-rank{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted-2);
    width:20px;
    flex:0 0 auto;
  }
  .fab-main{flex:1; min-width:0;}
  .fab-name{
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .fab-bar-track{
    height:5px;
    border-radius:3px;
    background:var(--bg);
    margin-top:6px;
    overflow:hidden;
  }
  .fab-bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:3px;
  }
  .fab-counts{
    flex:0 0 auto;
    display:flex;
    gap:10px;
  }
  .fab-count, .fab-carga{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:16px;
    color:var(--primary-ink);
    text-align:right;
    min-width:34px;
    line-height:1.15;
  }
  .fab-carga{color:var(--accent);}
  .fab-count span, .fab-carga span{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:9.5px;
    color:var(--muted-2);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .prod-meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:2px;
    flex:0 0 auto;
  }
  .prod-carga{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    color:var(--accent);
  }
  .fab-chevron{
    flex:0 0 auto;
    width:9px;height:9px;
    border-right:2px solid var(--muted-2);
    border-bottom:2px solid var(--muted-2);
    transform:rotate(-45deg);
    transition:transform .15s ease;
    margin-left:2px;
  }
  .fab-card.open .fab-chevron{transform:rotate(45deg);}
  .fab-detail{
    display:none;
    border-top:1px solid var(--border);
    background:#FCFBF8;
  }
  .fab-card.open .fab-detail{display:block;}
  .prod-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-top:1px solid var(--border);
  }
  .prod-row:first-child{border-top:none;}
  .prod-desc{
    font-size:13px;
    color:var(--ink);
    line-height:1.3;
  }
  .prod-barcode{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    flex:0 0 auto;
    letter-spacing:.02em;
  }

  /* flat search results */
  .flat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .flat-card .prod-row{padding:12px 14px;}
  .flat-fab-label{
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-top:2px;
  }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty .big{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    color:var(--ink);
    font-size:15px;
    margin-bottom:6px;
  }
  .footer-note{
    max-width:720px;
    margin:24px auto 0;
    padding:0 16px;
    font-size:11.5px;
    color:var(--muted-2);
    text-align:center;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">OpenFarma · Perfumería</p>
    <h1>Surtido Eficiente</h1>
    <p class="sub">Qué productos, de qué fabricantes, tiene cada sucursal</p>
  </div>
</div>

<div class="controls">
  <p class="field-label">Sucursal</p>
  <div class="select-wrap big">
    <select id="sucursalSelect"></select>
  </div>

  <p class="field-label">Categoría</p>
  <div class="pill-row" id="categoriaPills"></div>

  <p class="field-label">Departamento</p>
  <div class="select-wrap">
    <select id="departamentoSelect"></select>
  </div>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="Buscar producto o código de barras…">
    <button class="scan-btn" id="scanBtn" type="button" aria-label="Escanear código de barras">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="7" y2="12.01"/><line x1="11" y1="8" x2="11" y2="16"/><line x1="14" y1="8" x2="14" y2="16"/><line x1="17" y1="8" x2="17" y2="16"/></svg>
    </button>
  </div>
</div>

<div class="summary">
  <div class="count" id="summaryCount">–</div>
  <div class="branch-tag" id="summaryBranch"></div>
</div>

<div class="list" id="list"></div>

<div class="scan-modal" id="scanModal">
  <div class="scan-modal-head">
    <h2>Escanear código de barras</h2>
    <button class="scan-close" id="scanClose" type="button" aria-label="Cerrar">✕</button>
  </div>
  <div id="qr-reader"></div>
  <div class="scan-hint" id="scanHint">Apuntá la cámara al código de barras del producto</div>
</div>

<p class="footer-note">Datos internos OpenFarma · uso exclusivo del equipo de supervisión</p>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
// ======================================================
// CONFIGURACIÓN DE LA FUENTE DE DATOS
// Pegá acá el link de "Publicar en la web" (CSV) de tu Google Sheet.
// Mientras esté vacío, la app no va a poder cargar datos.
// ======================================================
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx9H-DtL1JQDuaT9ZY93AVIOj0mRUjrIJqRh097tdzUEKoKTQM3q52DDQ8DmepcQ/pub?gid=2070462243&single=true&output=csv";

// Encabezados esperados en la Sheet (no importa el orden de columnas,
// sí importa que existan estos nombres en la primera fila):
// Sucursal | EAN | Descripción | Carga | Subrubro | Categoría | Laboratorio
</script>
<script>
const state = {
  sucursal: null,
  categoria: null, // index or null = todas
  departamento: null,
  search: '',
  openFab: new Set()
};

const sucursalSelect = document.getElementById('sucursalSelect');
const categoriaPills = document.getElementById('categoriaPills');
const departamentoSelect = document.getElementById('departamentoSelect');
const searchInput = document.getElementById('searchInput');
const listEl = document.getElementById('list');
const summaryCount = document.getElementById('summaryCount');
const summaryBranch = document.getElementById('summaryBranch');

// ---- populate sucursal select ----
function initSucursalSelect(){
  const optAll = document.createElement('option');
  optAll.value = '__ALL__';
  optAll.textContent = '— Todas las sucursales —';
  sucursalSelect.appendChild(optAll);
  sucursales.forEach(s=>{
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    sucursalSelect.appendChild(o);
  });
  sucursalSelect.value = state.sucursal;
  sucursalSelect.addEventListener('change', ()=>{
    state.sucursal = sucursalSelect.value;
    state.openFab.clear();
    refreshDepartamentoOptions();
    render();
  });
}

// ---- categoria pills ----
function initCategoriaPills(){
  const mk = (label, idx)=>{
    const el = document.createElement('div');
    el.className = 'pill' + (state.categoria===idx ? ' active':'');
    el.textContent = label;
    el.addEventListener('click', ()=>{
      state.categoria = idx;
      state.openFab.clear();
      refreshDepartamentoOptions();
      renderPills();
      render();
    });
    return el;
  };
  categoriaPills.innerHTML='';
  categoriaPills.appendChild(mk('Todas', null));
  categorias.forEach((c,i)=> categoriaPills.appendChild(mk(c, i)));
}
function renderPills(){
  [...categoriaPills.children].forEach((el,i)=>{
    const idx = i===0 ? null : i-1;
    el.classList.toggle('active', state.categoria===idx);
  });
}

// ---- carga total por producto (para la vista "Todas las sucursales") ----
let productTotalCarga = [];
function computeProductTotalCarga(){
  productTotalCarga = new Array(products.length).fill(0);
  Object.values(assort).forEach(entries=>{
    entries.forEach(([idx, carga])=>{ productTotalCarga[idx] += carga; });
  });
}

// ---- departamento select (dependent) ----
function currentBaseEntries(){
  // [{idx, carga}] de productos disponibles segun la sucursal elegida
  if(state.sucursal === '__ALL__'){
    return products.map((_,idx)=>({idx, carga: productTotalCarga[idx]}));
  }
  return (assort[state.sucursal] || []).map(([idx,carga])=>({idx, carga}));
}
function refreshDepartamentoOptions(){
  const base = currentBaseEntries();
  const depSet = new Set();
  const iterate = ({idx})=>{
    const p = products[idx];
    if(state.categoria!==null && p[1]!==state.categoria) return;
    if(p[2]>=0) depSet.add(p[2]);
  };
  base.forEach(iterate);

  const prevVal = departamentoSelect.value;
  departamentoSelect.innerHTML='';
  const optAll = document.createElement('option');
  optAll.value=''; optAll.textContent='Todos los departamentos';
  departamentoSelect.appendChild(optAll);
  [...depSet].sort((a,b)=>departamentos[a].localeCompare(departamentos[b])).forEach(di=>{
    const o = document.createElement('option');
    o.value = di; o.textContent = departamentos[di];
    departamentoSelect.appendChild(o);
  });
  if(prevVal && [...depSet].map(String).includes(prevVal)){
    departamentoSelect.value = prevVal;
    state.departamento = Number(prevVal);
  } else {
    departamentoSelect.value='';
    state.departamento = null;
  }
}
departamentoSelect.addEventListener('change', ()=>{
  state.departamento = departamentoSelect.value===''? null : Number(departamentoSelect.value);
  render();
});

searchInput.addEventListener('input', ()=>{
  state.search = searchInput.value.trim().toLowerCase();
  render();
});

// ---- filtering ----
function computeFiltered(){
  const base = currentBaseEntries();
  return base.filter(({idx})=>{
    const p = products[idx];
    if(state.categoria!==null && p[1]!==state.categoria) return false;
    if(state.departamento!==null && p[2]!==state.departamento) return false;
    if(state.search){
      const hay = (p[0]+' '+p[4]).toLowerCase();
      if(!hay.includes(state.search)) return false;
    }
    return true;
  });
}

function fmtInt(n){ return n.toLocaleString('es-AR'); }

function render(){
  const filtered = computeFiltered();
  const totalCarga = filtered.reduce((s,e)=>s+e.carga,0);
  summaryCount.innerHTML = `<span>${filtered.length}</span> referencia${filtered.length===1?'':'s'} · <span>${fmtInt(totalCarga)}</span> u. de carga`;
  summaryBranch.textContent = state.sucursal==='__ALL__' ? 'Todas las sucursales' : state.sucursal;

  if(filtered.length===0){
    listEl.innerHTML = `<div class="empty"><div class="big">Sin resultados</div>No hay productos que coincidan con estos filtros.</div>`;
    return;
  }

  if(state.search){
    renderFlatList(filtered);
  } else {
    renderByFabricante(filtered);
  }
}

function renderFlatList(filtered){
  const sorted = [...filtered].sort((a,b)=> products[a.idx][0].localeCompare(products[b.idx][0]));
  const rows = sorted.map(({idx,carga})=>{
    const p = products[idx];
    const fab = p[3]>=0 ? fabricantes[p[3]] : '—';
    return `<div class="prod-row"><div><div class="prod-desc">${escapeHtml(p[0])}</div><div class="flat-fab-label">${escapeHtml(fab)}</div></div><div class="prod-meta"><div class="prod-barcode">${escapeHtml(p[4])}</div><div class="prod-carga">${fmtInt(carga)} u.</div></div></div>`;
  }).join('');
  listEl.innerHTML = `<div class="flat-card">${rows}</div>`;
}

function renderByFabricante(filtered){
  const byFab = new Map();
  filtered.forEach(({idx,carga})=>{
    const p = products[idx];
    const fi = p[3];
    if(!byFab.has(fi)) byFab.set(fi, []);
    byFab.get(fi).push({idx,carga});
  });
  const entries = [...byFab.entries()].sort((a,b)=>{
    const nameA = a[0]>=0 ? fabricantes[a[0]] : 'Sin fabricante';
    const nameB = b[0]>=0 ? fabricantes[b[0]] : 'Sin fabricante';
    return nameA.localeCompare(nameB);
  });
  const maxCount = entries.length ? Math.max(...entries.map(([,items])=>items.length)) : 1;

  listEl.innerHTML = entries.map(([fi, items], rank)=>{
    const name = fi>=0 ? fabricantes[fi] : 'Sin fabricante';
    const pct = Math.max(6, Math.round(items.length/maxCount*100));
    const isOpen = state.openFab.has(fi);
    const fabCarga = items.reduce((s,e)=>s+e.carga,0);
    const sortedItems = [...items].sort((a,b)=>products[a.idx][0].localeCompare(products[b.idx][0]));
    const rows = sortedItems.map(({idx,carga})=>{
      const p = products[idx];
      return `<div class="prod-row"><div class="prod-desc">${escapeHtml(p[0])}</div><div class="prod-meta"><div class="prod-barcode">${escapeHtml(p[4])}</div><div class="prod-carga">${fmtInt(carga)} u.</div></div></div>`;
    }).join('');
    return `
    <div class="fab-card${isOpen?' open':''}" data-fab="${fi}">
      <div class="fab-head" onclick="toggleFab(${fi})">
        <div class="fab-rank">${String(rank+1).padStart(2,'0')}</div>
        <div class="fab-main">
          <div class="fab-name">${escapeHtml(name)}</div>
          <div class="fab-bar-track"><div class="fab-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="fab-counts">
          <div class="fab-count">${items.length}<span>ref.</span></div>
          <div class="fab-carga">${fmtInt(fabCarga)}<span>u.</span></div>
        </div>
        <div class="fab-chevron"></div>
      </div>
      <div class="fab-detail">${rows}</div>
    </div>`;
  }).join('');
}

function toggleFab(fi){
  if(state.openFab.has(fi)) state.openFab.delete(fi);
  else state.openFab.add(fi);
  const card = listEl.querySelector(`.fab-card[data-fab="${fi}"]`);
  if(card) card.classList.toggle('open');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function stripAccents(s){
  return String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
}
function normKey(s){
  return stripAccents(String(s).trim()).toUpperCase();
}
function findHeader(headers, ...candidates){
  const norm = headers.map(h=>normKey(h));
  for(const c of candidates){
    const idx = norm.indexOf(normKey(c));
    if(idx>=0) return headers[idx];
  }
  return null;
}

function buildDataFromRows(rows, headers){
  const hSucursal = findHeader(headers, 'Sucursal');
  const hEan = findHeader(headers, 'EAN', 'CODIGO_BARRA', 'Codigo Barra', 'Código Barra', 'Codigo de Barras');
  const hDesc = findHeader(headers, 'Descripcion', 'Descripción');
  const hCarga = findHeader(headers, 'Carga');
  // "hSubrubro" = nivel amplio (pastillas de arriba). "hCategoria" = nivel granular (select de Departamento).
  // El orden de candidatos importa: se prueba primero el nombre exclusivo de cada formato de planilla,
  // para no confundir "Categoria" cuando aparece con distinto significado según el archivo.
  const hSubrubro = findHeader(headers, 'Subrubro', 'Categoria', 'Categoría');
  const hCategoria = findHeader(headers, 'Departamento', 'Categoria', 'Categoría');
  const hLab = findHeader(headers, 'Marca', 'Laboratorio', 'Fabricante');

  if(!hSucursal || !hEan){
    throw new Error('Faltan columnas obligatorias (Sucursal / EAN) en la planilla.');
  }

  const catalog = new Map();       // barcode -> [desc, subrubro, categoria, lab]
  const assortRaw = new Map();     // sucKey -> Map(barcode -> cargaSum)
  const sucursalDisplay = new Map();

  rows.forEach(r=>{
    const sucursalRaw = r[hSucursal];
    const ean = r[hEan];
    if(!sucursalRaw || !ean) return;
    const key = normKey(sucursalRaw);
    if(!sucursalDisplay.has(key)) sucursalDisplay.set(key, key);
    const barcode = String(ean).trim();
    const desc = hDesc ? (r[hDesc]||'') : '';
    const subrubro = hSubrubro ? (r[hSubrubro]||'') : '';
    const categoria = hCategoria ? (r[hCategoria]||'') : '';
    const lab = hLab ? (r[hLab]||'') : '';
    if(!catalog.has(barcode)) catalog.set(barcode, [desc, subrubro, categoria, lab]);
    const carga = hCarga ? (parseFloat(String(r[hCarga]).replace(',','.'))||0) : 0;
    if(!assortRaw.has(key)) assortRaw.set(key, new Map());
    const m = assortRaw.get(key);
    m.set(barcode, (m.get(barcode)||0) + carga);
  });

  const barcodes = [...catalog.keys()].sort();
  const barcodeToIdx = new Map(barcodes.map((b,i)=>[b,i]));

  const categoriasSet = new Set(), departamentosSet = new Set(), fabricantesSet = new Set();
  catalog.forEach(v=>{
    if(v[1]) categoriasSet.add(v[1]);
    if(v[2]) departamentosSet.add(v[2]);
    if(v[3]) fabricantesSet.add(v[3]);
  });
  const categorias = [...categoriasSet].sort((a,b)=>a.localeCompare(b));
  const departamentos = [...departamentosSet].sort((a,b)=>a.localeCompare(b));
  const fabricantes = [...fabricantesSet].sort((a,b)=>a.localeCompare(b));
  const catIdx = new Map(categorias.map((c,i)=>[c,i]));
  const depIdx = new Map(departamentos.map((d,i)=>[d,i]));
  const fabIdx = new Map(fabricantes.map((f,i)=>[f,i]));

  const products = barcodes.map(b=>{
    const [desc, subrubro, categoria, lab] = catalog.get(b);
    return [
      desc,
      subrubro ? catIdx.get(subrubro) : -1,
      categoria ? depIdx.get(categoria) : -1,
      lab ? fabIdx.get(lab) : -1,
      b
    ];
  });

  const sucursales = [...sucursalDisplay.values()].sort((a,b)=>a.localeCompare(b));
  const assort = {};
  assortRaw.forEach((m, key)=>{
    const disp = sucursalDisplay.get(key);
    const arr = [];
    m.forEach((carga, b)=> arr.push([barcodeToIdx.get(b), carga]));
    arr.sort((x,y)=>x[0]-y[0]);
    assort[disp] = arr;
  });

  return { categorias, departamentos, fabricantes, sucursales, products, assort };
}

function showLoadError(msg){
  document.querySelector('.controls').style.display='none';
  document.querySelector('.summary').style.display='none';
  document.getElementById('list').innerHTML = `<div class="empty"><div class="big">No se pudieron cargar los datos</div>${msg}</div>`;
}

let DATA, categorias, departamentos, fabricantes, sucursales, products, assort;

function startApp(){
  ({ categorias, departamentos, fabricantes, sucursales, products, assort } = DATA);
  state.sucursal = sucursales[0] || null;
  computeProductTotalCarga();
  initSucursalSelect();
  initCategoriaPills();
  refreshDepartamentoOptions();
  render();
}

if(!CSV_URL){
  showLoadError('Todavía no se configuró el link de la planilla de datos.');
} else {
  document.getElementById('list').innerHTML = `<div class="empty"><div class="big">Cargando datos…</div></div>`;
  const bustCacheUrl = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_ts=' + Date.now();
  fetch(bustCacheUrl, { cache: 'no-store' })
    .then(res=>{
      if(!res.ok) throw new Error('status ' + res.status);
      return res.text();
    })
    .then(text=>{
      const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
      const headers = parsed.meta.fields || [];
      DATA = buildDataFromRows(parsed.data, headers);
      startApp();
    })
    .catch(err=>{
      showLoadError('Revisá tu conexión a internet o si el link de la planilla sigue vigente. (' + err.message + ')');
    });
}
const scanModal = document.getElementById('scanModal');
const scanClose = document.getElementById('scanClose');
const scanHint = document.getElementById('scanHint');
let html5QrCode = null;
let scanning = false;

function openScanner(){
  scanModal.classList.add('open');
  scanHint.textContent = 'Apuntá la cámara al código de barras del producto';
  scanHint.classList.remove('scan-error');

  if(typeof Html5Qrcode === 'undefined'){
    scanHint.textContent = 'No se pudo cargar el lector de cámara (revisá tu conexión a internet).';
    return;
  }

  html5QrCode = new Html5Qrcode('qr-reader', {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39
    ],
    verbose:false
  });

  const scanConfig = { fps: 10, qrbox: { width: 260, height: 140 } };
  const onSuccess = (decodedText)=>{
    if(!scanning) return;
    scanning = false;
    searchInput.value = decodedText;
    state.search = decodedText.trim().toLowerCase();
    render();
    closeScanner();
  };
  const onFail = ()=>{ /* frame sin resultado, ignorar */ };
  const onError = ()=>{
    scanHint.textContent = 'No se pudo acceder a la cámara. Revisá los permisos de cámara en el navegador (en iPhone: Ajustes → Safari → Cámara).';
    scanHint.classList.add('scan-error');
  };

  // Safari/iOS suele rechazar "facingMode: environment" directo; probamos en cascada
  // hasta encontrar un método que funcione, sin que el usuario note la diferencia.
  html5QrCode.start({ facingMode: { exact: 'environment' } }, scanConfig, onSuccess, onFail)
    .then(()=>{ scanning = true; })
    .catch(()=>{
      html5QrCode.start({ facingMode: 'environment' }, scanConfig, onSuccess, onFail)
        .then(()=>{ scanning = true; })
        .catch(()=>{
          Html5Qrcode.getCameras()
            .then(devices=>{
              if(devices && devices.length){
                const backCam = devices[devices.length - 1];
                html5QrCode.start(backCam.id, scanConfig, onSuccess, onFail)
                  .then(()=>{ scanning = true; })
                  .catch(onError);
              } else {
                onError();
              }
            })
            .catch(onError);
        });
    });
}

function closeScanner(){
  scanModal.classList.remove('open');
  scanning = false;
  if(html5QrCode){
    html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});
  }
}

scanBtn.addEventListener('click', openScanner);
scanClose.addEventListener('click', closeScanner);
</script>
